workflows:
  # ============================================================================
  # ANDROID - Free Firebase Distribution (No Play Store)
  # ============================================================================
  android-workflow:
    name: Android Development Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: 'Dev'
          include: true
          source: true
        - pattern: 'Hsf'
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      groups:
        - firebase_config  # We'll create this group
      vars:
        PACKAGE_NAME: "io.codemagic.fluttersample"  # Update with your package name
      flutter: stable
      xcode: latest
    scripts:
      - name: 📋 Flutter Version Check
        script: | 
          flutter --version
          flutter doctor -v
      
      - name: 🔧 Set up local.properties
        script: | 
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: 📦 Get Flutter packages
        script: | 
          flutter pub get
      
      - name: 🔍 Flutter analyze
        script: | 
          flutter analyze --no-fatal-infos
      
      - name: 🧪 Flutter unit tests
        script: | 
          flutter test --coverage
        ignore_failure: true
      
      - name: 🤖 Build Android APK (Release)
        script: | 
          BUILD_NUMBER=$(($(date +%s) / 60))  # Unix timestamp in minutes
          echo "Building with build number: $BUILD_NUMBER"
          
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
      
      - name: ✅ Verify APK
        script: | 
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "❌ APK not found at $APK_PATH"
            exit 1
          fi
          
          echo "✅ APK built successfully!"
          ls -lh "$APK_PATH"
          
          # Get APK size
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "📦 APK Size: $APK_SIZE"
          
          # Get APK info
          echo "📱 APK Info:"
          aapt dump badging "$APK_PATH" | grep -E "package:|sdkVersion:|targetSdkVersion:"
    
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
      - coverage/lcov.info
    
    publishing:
      # Free Firebase App Distribution
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers
          artifact_type: 'apk'
      
      # Email notifications
      email:
        recipients:
          - mshaseefat@gmail.com
          - mshaseef2013@gmail.com
        notify:
          success: true
          failure: true
