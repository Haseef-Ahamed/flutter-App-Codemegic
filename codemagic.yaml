workflows:
  android-workflow:
    name: Android Development Build
    # max_build_duration: 60
    # instance_type: mac_mini_m1
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: 'Dev'
    #       include: true
    #       source: true
    #     - pattern: 'Hsf'
    #       include: true
    #       source: true
    #   cancel_previous_builds: true
    environment:
      # ✅ NO android_signing section - we don't need it for Firebase!
      groups:
        - firebase_config  # Only Firebase credentials needed
      vars:
        PACKAGE_NAME: "io.codemagic.fluttersample"  # TODO: Update this
      flutter: stable
      xcode: latest
    scripts:
      - name: 🔧 Set up local.properties
        script: | 
          echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      
      - name: 📦 Get Flutter packages
        script: | 
          flutter pub get
      
      - name: 🔍 Flutter analyze
        script: | 
          flutter analyze --no-fatal-infos
      
      - name: 🧪 Flutter tests
        script: | 
          flutter test
        ignore_failure: true
      
      - name: 🤖 Build Android APK (Release)
        script: | 
          # Use timestamp-based build number (no Play Store needed)
          BUILD_NUMBER=$(($(date +%s) / 60))
          echo "Building APK with build number: $BUILD_NUMBER"
          
          # Build APK (NOT AAB - APK is for Firebase)
          flutter build apk --release \
            --build-name=1.0.$BUILD_NUMBER \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - flutter_drive.log
      
    #   - name: ✅ Verify APK
    #     script: | 
    #       APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
    #       if [ ! -f "$APK_PATH" ]; then
    #         echo "❌ APK not found"
    #         exit 1
    #       fi
    #       echo "✅ APK built successfully!"
    #       ls -lh "$APK_PATH"
    
    # artifacts:
    #   - build/app/outputs/flutter-apk/*.apk
    
    publishing:
      firebase:
        firebase_service_account: $Firebase_service_Account
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          groups:
            - testers
          artifact_type: 'apk'
      
      email:
        recipients:
          - mshaseefat@gmail.com
